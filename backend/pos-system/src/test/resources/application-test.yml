spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pharmaflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      pool-name: pharmaflow-test
      maximum-pool-size: 2
      minimum-idle: 0
      data-source-properties:
        ApplicationName: pharmaflow-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false

  security:
    user:
      name: test
      password: test

  redis:
    host: localhost
    port: 6379

  mail:
    host: localhost
    port: 1025
    username:
    password:

  server:
    port: 0 # Random port

  logging:
    level:
      org.springframework.security: TRACE

aws:
  access.key:
  secret.key:
  s3.bucket:
  region: ap-south-1

jwt:
  secret: TestOnlySecretKeyForPharmaFlowBackendSmokeBuilds1234567890
  expiration: 86400000

management:
  metrics:
    export:
      prometheus:
        enabled: false
  health:
    mail:
      enabled: false
    redis:
      enabled: false

pharmaflow:
  redis:
    enabled: false
  storage:
    provider: local
    local-root: ./target/test-documents
  medicine:
    auto-import: false
