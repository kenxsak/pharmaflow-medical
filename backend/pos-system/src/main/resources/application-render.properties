spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:true}
spring.jmx.enabled=${SPRING_JMX_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

server.forward-headers-strategy=framework
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:32}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:4}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:80}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:200}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
spring.datasource.hikari.data-source-properties.socketTimeout=${SPRING_DATASOURCE_SOCKET_TIMEOUT:300}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=${HIBERNATE_USE_JDBC_METADATA_DEFAULTS:false}

management.metrics.export.prometheus.enabled=${PROMETHEUS_METRICS_EXPORT:false}
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=${MANAGEMENT_HEALTH_READINESS_INCLUDE:readinessState,db}

# The hosted demo database is already seeded. Turn this on only for the first
# boot of a fresh demo database, then keep it off to avoid repeated startup work.
pharmaflow.demo-bootstrap.enabled=${PHARMAFLOW_DEMO_BOOTSTRAP_ENABLED:false}
