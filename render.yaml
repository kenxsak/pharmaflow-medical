services:
  - type: web
    name: pharmaflow-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/pos-system/Dockerfile
    dockerContext: ./backend/pos-system
    healthCheckPath: /actuator/health/liveness
    autoDeployTrigger: commit
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: RENDER_REGION
        value: singapore
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"
      - key: SPRING_JMX_ENABLED
        value: "false"
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "32"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "4"
      - key: SERVER_TOMCAT_ACCEPT_COUNT
        value: "80"
      - key: SERVER_TOMCAT_MAX_CONNECTIONS
        value: "200"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: pharmaflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pharmaflow-db
          property: password
      - key: SPRING_DATASOURCE_HIKARI_POOL_NAME
        value: pharmaflow-render
      - key: SPRING_DATASOURCE_APPLICATION_NAME
        value: pharmaflow-render
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "8"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "20000"
      - key: SPRING_DATASOURCE_CONNECT_TIMEOUT
        value: "10"
      - key: SPRING_DATASOURCE_SOCKET_TIMEOUT
        value: "300"
      - key: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
        value: "5000"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "300000"
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "1200000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "300000"
      - key: JDBC_SHOW_SQL
        value: "false"
      - key: HIBERNATE_DDL_AUTO
        value: "none"
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: HIBERNATE_OPEN_IN_VIEW
        value: "false"
      - key: SPRING_SECURITY_USERNAME
        value: pharmaflow
      - key: SPRING_SECURITY_PASSWORD
        value: pharmaflow
      - key: SPRING_MAIL_HOST
        value: localhost
      - key: SPRING_MAIL_PORT
        value: "1025"
      - key: SPRING_USER_NAME
        value: ""
      - key: SPRING_PASSWORD
        value: ""
      - key: AWS_ACCESS_KEY
        value: ""
      - key: AWS_SECRET_KEY
        value: ""
      - key: AWS_S3_BUCKET
        value: ""
      - key: AWS_REGION
        value: ap-south-1
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: PHARMAFLOW_STORAGE_PROVIDER
        value: auto
      - key: PHARMAFLOW_STORAGE_LOCAL_ROOT
        value: /tmp/pharmaflow-documents
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HEALTH
        value: "false"
      - key: REDIS_HEALTH
        value: "false"
      - key: PHARMAFLOW_REDIS_ENABLED
        value: "false"
      - key: PROMETHEUS_METRICS_EXPORT
        value: "false"
      - key: PHARMAFLOW_DEMO_BOOTSTRAP_ENABLED
        value: "false"
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health,info
      - key: MANAGEMENT_HEALTH_READINESS_INCLUDE
        value: readinessState,db
      - key: SECURITY_LOG_LEVEL
        value: INFO
      - key: PHARMAFLOW_SLOW_REQUEST_THRESHOLD_MS
        value: "1500"
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.wmart.in,https://*.netlify.app,https://*.onrender.com,https://*.koyeb.app,http://localhost:3000,http://localhost:3001
      - key: PHARMAFLOW_BRAND_NAME
        value: MedInOne
      - key: PHARMAFLOW_BRAND_TAGLINE
        value: One connected workspace for pharmacy billing, inventory, compliance, and delivery
      - key: PHARMAFLOW_BRAND_SUPPORT_EMAIL
        value: support@medinone.in
      - key: PHARMAFLOW_BRAND_SUPPORT_PHONE
        value: +91 44 4000 9000
      - key: PHARMAFLOW_MEDICINE_AUTO_IMPORT
        value: "false"

  - type: web
    name: pharmaflow-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: pharmaflow-backend
          property: host
      - key: REACT_APP_STORE_NAME
        value: MedInOne
      - key: REACT_APP_BRAND_NAME
        value: MedInOne
      - key: REACT_APP_BRAND_TAGLINE
        value: One connected workspace for pharmacy billing, inventory, compliance, and delivery
      - key: REACT_APP_BRAND_SUPPORT_EMAIL
        value: support@medinone.in

databases:
  - name: pharmaflow-db
    plan: free
    region: singapore
    databaseName: pharmaflow
    user: pharmaflow_user
    ipAllowList: []
